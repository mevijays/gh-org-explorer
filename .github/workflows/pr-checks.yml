name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One run per PR; a new push cancels the previous run.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  COVERAGE_OVERALL_THRESHOLD: '80'
  COVERAGE_NEW_LINE_THRESHOLD: '90'

jobs:
  test-and-coverage:
    name: Test + coverage gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          # The new-line gate diffs against the merge base, so the full history
          # (not the default single commit) has to be available.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests with coverage
        id: vitest
        run: npm run coverage

      - name: Evaluate coverage gates
        id: gate
        if: always() && steps.vitest.outcome != 'cancelled'
        run: node scripts/coverage-report.mjs --base "${{ github.event.pull_request.base.ref }}"

      - name: Comment the report on the PR
        if: always() && hashFiles('coverage/report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- coverage-gate-report -->'
            const body = `${marker}\n${fs.readFileSync('coverage/report.md', 'utf8')}`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              core.info(`Updated coverage comment ${existing.id}.`)
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
              core.info('Created a new coverage comment.')
            }

      - name: Fail the check when a gate was not met
        if: always() && steps.gate.outcome == 'failure'
        run: |
          echo "::error title=Coverage gate::Overall coverage must be >= ${COVERAGE_OVERALL_THRESHOLD}% and new-line coverage >= ${COVERAGE_NEW_LINE_THRESHOLD}%. See the PR comment for details."
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Report bundle size
        run: |
          {
            echo "## 📦 Production build"
            echo
            echo '| File | Size |'
            echo '| --- | ---: |'
            find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) \
              -exec du -h {} + | sort -k2 | awk '{print "| `" $2 "` | " $1 " |"}'
            echo
            echo "Total: **$(du -sh dist | cut -f1)**"
          } >> "$GITHUB_STEP_SUMMARY"
